name: phase-2f-7-refactor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase-2f-7-refactor.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize extracted page helpers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text()
          start = text.find("const dbToUiStatus=")
          end = text.find("\n\nexport default function Home", start)
          if start == -1 or end == -1:
              raise SystemExit(f"could not locate duplicate helper boundaries: start={start}, end={end}")
          text = text[:start] + text[end+2:]
          path.write_text(text)
          print("Removed duplicated helpers; page now uses extracted utilities")
          PY
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(frontend): use extracted Barber G13 utilities"
          git push
