name: phase-2f-7-refactor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase-2f-7-refactor.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize extracted page helpers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/page.tsx")
          text = path.read_text()
          pattern = re.compile(r'const dbToUiStatus=.*?const formatTransactionDate=.*?;\\n', re.S)
          text, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f"expected one duplicated helper block, found {count}")
          path.write_text(text)
          print("Removed duplicated helpers; page now uses extracted utilities")
          PY
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(frontend): use extracted Barber G13 utilities"
          git push
