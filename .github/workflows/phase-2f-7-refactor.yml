name: phase-2f-7-refactor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase-2f-7-refactor.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor current page.tsx imports
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text()

          if 'from "@/components/barber-g13/types"' not in text:
              marker = 'import { getAuthContext, signOut, type AuthContext } from "@/lib/auth";'
              if marker not in text:
                  raise SystemExit("auth import marker not found; aborting")
              imports = marker + '\n' + 'import type { Appointment, AppointmentStatus, Barber, Client, DbAppointmentStatus, HistoricalAppointment, PaymentMethod, Service, Transaction, TransactionType } from "@/components/barber-g13/types";' + '\n' + 'import { dateKey, dbToUiStatus, formatRegisteredDate, formatTransactionDate, normalizePhone, uiToDbStatus } from "@/components/barber-g13/utils";'
              text = text.replace(marker, imports, 1)

          start = text.find('type AppointmentStatus =')
          end = text.find('const Icon =', start)
          if start == -1 or end == -1:
              raise SystemExit(f"could not locate extraction boundaries: start={start}, end={end}")

          text = text[:start] + text[end:]
          path.write_text(text)
          print("Extracted types and shared utilities from the current app/page.tsx")
          PY
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor(frontend): extract Barber G13 types and utilities"
          git push
