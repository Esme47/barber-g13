name: Phase 2F.7C Shell Extraction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract sidebar and topbar from current page
        shell: python
        run: |
          from pathlib import Path
          page = Path('app/page.tsx')
          text = page.read_text(encoding='utf-8')
          aside_start = text.index('<aside className={`sidebar')
          aside_end = text.index('</aside>', aside_start) + len('</aside>')
          aside = text[aside_start:aside_end]
          header_start = text.index('<header className="topbar">')
          header_end = text.index('</header>', header_start) + len('</header>')
          header = text[header_start:header_end]
          sidebar_body = aside.replace('menuOpen', 'open').replace('setMenuOpen', 'onClose').replace('setActive', 'onNavigate').replace('signOut', 'onLogout').replace('router.replace("/login")', 'onLogout()')
          sidebar_body = sidebar_body.replace('onClick={async()=>{await onLogout();onLogout()}}', 'onClick={onLogout}')
          sidebar_body = sidebar_body.replace('onClick={()=>setMenuOpen(false)}', 'onClick={onClose}')
          sidebar_body = sidebar_body.replace('onClick={()=>setActive(item.name);setMenuOpen(false)}', 'onClick={()=>{onNavigate(item.name);onClose();}}')
          header_body = header.replace('setMenuOpen', 'onOpenMenu')
          layout = '''import type { ReactNode } from "react";\nimport { getInitials } from "./ui";\n\nexport type NavigationItem = { name: string; icon: ReactNode };\n\ntype SidebarProps = { menu: NavigationItem[]; menuOpen: boolean; active: string; staffName: string; staffRole: string; onClose: () => void; onNavigate: (name: string) => void; onLogout: () => void; };\n\nexport function Sidebar({ menu, menuOpen, active, staffName, staffRole, onClose, onNavigate, onLogout }: SidebarProps) {\n  return ''' + sidebar_body + ''';\n}\n\ntype TopbarProps = { active: string; staffRole: string; menuOpen: boolean; onOpenMenu: () => void; };\n\nexport function Topbar({ active, staffRole, menuOpen, onOpenMenu }: TopbarProps) {\n  return ''' + header_body + ''';\n}\n'''
          Path('components/barber-g13/layout.tsx').write_text(layout, encoding='utf-8')
          text = text[:aside_start] + '<Sidebar menu={menu} menuOpen={menuOpen} active={active} staffName={staffName} staffRole={staffRole} onClose={()=>setMenuOpen(false)} onNavigate={setActive} onLogout={async()=>{await signOut();router.replace("/login")}} />' + text[aside_end:]
          header_start = text.index('<header className="topbar">')
          header_end = text.index('</header>', header_start) + len('</header>')
          text = text[:header_start] + '<Topbar active={active} staffRole={staffRole} menuOpen={menuOpen} onOpenMenu={()=>setMenuOpen(true)} />' + text[header_end:]
          text = text.replace('import { Icon, hours, getInitials, formatCurrency, formatDate } from "@/components/barber-g13/ui";', 'import { Icon, hours, formatCurrency, formatDate } from "@/components/barber-g13/ui";\nimport { Sidebar, Topbar } from "@/components/barber-g13/layout";')
          page.write_text(text, encoding='utf-8')

      - name: Validate extraction
        run: |
          test -s components/barber-g13/layout.tsx
          grep -q 'Sidebar' app/page.tsx
          grep -q 'Topbar' app/page.tsx
          ! grep -q '<aside className={`sidebar' app/page.tsx
          ! grep -q '<header className="topbar">' app/page.tsx

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/barber-g13/layout.tsx
          git commit -m "refactor(frontend): extract Barber G13 shell UI" || exit 0
          git push origin main
