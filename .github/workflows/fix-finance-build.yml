name: Fix finance build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix TypeScript status mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'const uiToDbStatus=(s:AppointmentStatus):DbAppointmentStatus=>({"Pendiente":"pending","Confirmada":"confirmed","En proceso":"confirmed","Finalizada":"completed","Cancelada":"cancelled"}[s]);'
          new = 'const uiToDbStatus=(s:AppointmentStatus):DbAppointmentStatus=>({"Pendiente":"pending","Confirmada":"confirmed","En proceso":"confirmed","Finalizada":"completed","Cancelada":"cancelled"}[s] as DbAppointmentStatus);'
          if old not in s:
              raise SystemExit('Target line not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "fix(finance): restore typed appointment status mapping"
          git push origin main
