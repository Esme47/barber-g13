name: phase-2f-7e-fix
on:
  push:
    branches: [phase-2f-7d-data-layer]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix action alias collision
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace('toggleService, updateAppointmentStatus', 'toggleService as toggleServiceAction, updateAppointmentStatus')
          s = s.replace('await toggleService(id,service.active)', 'await toggleServiceAction(id,service.active)')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'fix(frontend): resolve typed action alias collision' || exit 0
          git push
