name: phase-2f-7b-ui

on:
  push:
    paths:
      - ".github/workflows/phase-2f-7b-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract UI primitives from page
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path("app/page.tsx")
          s=p.read_text()
          old='const Icon = { Grid: () => <span>▦</span>, Calendar: () => <span>◫</span>, Users: () => <span>♙</span>, Scissors: () => <span>✂</span>, Wallet: () => <span>◈</span>, Settings: () => <span>⚙</span>, Menu: () => <span>☰</span>, Plus: () => <span>＋</span>, ArrowLeft: () => <span>‹</span>, ArrowRight: () => <span>›</span>, Close: () => <span>×</span>, Phone: () => <span>☎</span>, Search: () => <span>⌕</span>, Edit: () => <span>✎</span> };\nconst hours=["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00"];'
          if old not in s: raise SystemExit("UI constants block not found")
          s=s.replace(old,'')
          old2='const getInitials=(name:string)=>name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase(),formatCurrency=(value:number)=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(value),formatDate=(date:Date)=>date.toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long",year:"numeric"});'
          if old2 not in s: raise SystemExit("UI helper block not found")
          s=s.replace(old2,'')
          marker='import { dateKey, dbToUiStatus, formatRegisteredDate, formatTransactionDate, normalizePhone, uiToDbStatus } from "@/components/barber-g13/utils";'
          if marker not in s: raise SystemExit("utils import marker not found")
          s=s.replace(marker, marker+'\nimport { Icon, hours, getInitials, formatCurrency, formatDate } from "@/components/barber-g13/ui";')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "refactor(frontend): extract Barber G13 UI primitives"
          git push
