name: Phase 2E.14 Reconciliation Patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Finance reconciliation center
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          old=' const paymentSummary=useMemo(()=>{const methods:PaymentMethod[]=["Efectivo","Nequi","Transferencia","Tarjeta"];return methods.map(method=>({method,amount:transactions.filter(t=>t.type==="Ingreso"&&t.paymentMethod===method).reduce((a,t)=>a+t.amount,0)}));},[transactions]);\n'
          new=old+' const reconciliation=useMemo(()=>{const completedAppointments=historicalAppointments.length;const completedWithIncome=historicalAppointments.filter(a=>transactions.some(t=>t.type==="Ingreso"&&t.appointmentId===a.id)).length;const completedWithoutIncome=completedAppointments-completedWithIncome;const linkedIncome=transactions.filter(t=>t.type==="Ingreso"&&t.appointmentId);const orphanIncome=linkedIncome.filter(t=>!historicalAppointments.some(a=>a.id===t.appointmentId)).length;const unlinkedIncome=transactions.filter(t=>t.type==="Ingreso"&&!t.appointmentId);const linkedDetails=historicalAppointments.filter(a=>transactions.some(t=>t.type==="Ingreso"&&t.appointmentId===a.id)).map(a=>{const income=transactions.find(t=>t.type==="Ingreso"&&t.appointmentId===a.id);const difference=income?income.amount-a.price:0;return{...a,incomeAmount:income?.amount||0,paymentMethod:income?.paymentMethod||"",difference,status:difference===0?"Conciliado":difference>0?"Cobrado de más":"Cobrado de menos"};});return{completedAppointments,completedWithIncome,completedWithoutIncome,linkedIncome:linkedIncome.length,orphanIncome,unlinkedIncome:unlinkedIncome.length,linkedDetails};},[historicalAppointments,transactions]);\n'
          if old not in s: raise SystemExit('paymentSummary anchor not found')
          s=s.replace(old,new,1)
          start=' const renderFinances=()=> '
          end=';\n if(authLoading)return '
          i=s.find(start)
          j=s.find(end,i)
          if i<0 or j<0: raise SystemExit('renderFinances boundaries not found')
          replacement=''' const renderFinances=()=> <section className="module-page"><div className="module-heading"><div><p className="section-label">CONTROL FINANCIERO</p><h1>Finanzas <em>G13</em></h1><p className="welcome-text">Registra ingresos, gastos y controla la rentabilidad.</p></div><div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"flex-end"}}><button className="primary-button" onClick={()=>setShowRegularizationModal(true)} disabled={regularizableAppointments.length===0}>Vincular ingreso a cita</button><button className="primary-button" onClick={()=>setShowTransactionModal(true)}><Icon.Plus/>Nuevo movimiento</button></div></div><div className="stats-grid"><article className="stat-card"><div className="stat-header"><span>INGRESOS</span><Icon.Wallet/></div><h2>{formatCurrency(financialSummary.sales)}</h2><p>Ventas y servicios</p></article><article className="stat-card"><div className="stat-header"><span>GASTOS</span><Icon.Wallet/></div><h2>{formatCurrency(financialSummary.expenses)}</h2><p>Costos registrados</p></article><article className="stat-card gold-card"><div className="stat-header"><span>UTILIDAD NETA</span><Icon.Grid/></div><h2>{formatCurrency(financialSummary.profit)}</h2><p>Resultado actual</p></article><article className="stat-card"><div className="stat-header"><span>SERVICIOS COBRADOS</span><Icon.Scissors/></div><h2>{financialSummary.servicesCompleted}</h2><p>Movimientos de ingreso</p></article></div><div className="stats-grid" style={{marginBottom:24}}><article className="stat-card"><div className="stat-header"><span>HOY</span><Icon.Calendar/></div><h2>{formatCurrency(financialPeriods.today.income)}</h2><p>Utilidad {formatCurrency(financialPeriods.today.profit)}</p></article><article className="stat-card"><div className="stat-header"><span>ESTA SEMANA</span><Icon.Calendar/></div><h2>{formatCurrency(financialPeriods.week.income)}</h2><p>Utilidad {formatCurrency(financialPeriods.week.profit)}</p></article><article className="stat-card"><div className="stat-header"><span>ESTE MES</span><Icon.Calendar/></div><h2>{formatCurrency(financialPeriods.month.income)}</h2><p>Utilidad {formatCurrency(financialPeriods.month.profit)}</p></article><article className="stat-card gold-card"><div className="stat-header"><span>TICKET PROMEDIO</span><Icon.Wallet/></div><h2>{formatCurrency(financialInsights.average)}</h2><p>{financialInsights.movements} movimientos</p></article></div><section className="dashboard-grid"><article className="panel"><div className="panel-header"><div><p className="section-label">MÉTODOS DE PAGO</p><h2>Ingresos por canal</h2></div></div><div className="appointments">{paymentSummary.map(p=><div className="appointment" key={p.method}><div className="client-avatar">{p.method.charAt(0)}</div><div className="client-details"><strong>{p.method}</strong><span>Ingresos registrados</span></div><div className="appointment-time">{formatCurrency(p.amount)}</div></div>)}</div></article><article className="panel performance-panel"><div className="panel-header"><div><p className="section-label">RENTABILIDAD</p><h2>Balance general</h2></div></div><div className="chart-total"><span>Total histórico</span><strong>{formatCurrency(financialSummary.sales)}</strong></div><div className="chart-total"><span>Utilidad histórica</span><strong>{formatCurrency(financialSummary.profit)}</strong></div><div className="chart-total"><span>Margen histórico</span><strong>{financialInsights.margin.toFixed(1)}%</strong></div></article></section><section className="panel" style={{marginTop:24}}><div className="panel-header"><div><p className="section-label">CONCILIACIÓN</p><h2>Agenda ↔ Finanzas</h2><p className="welcome-text">Verificación de citas finalizadas frente a sus ingresos registrados.</p></div><span className={`status ${reconciliation.completedWithoutIncome===0&&reconciliation.orphanIncome===0?"status-confirmada":"status-cancelada"}`}>{reconciliation.completedWithoutIncome===0&&reconciliation.orphanIncome===0?"Todo conciliado":"Revisar"}</span></div><div className="stats-grid"><article className="stat-card"><div className="stat-header"><span>CITAS FINALIZADAS</span><Icon.Calendar/></div><h2>{reconciliation.completedAppointments}</h2><p>{reconciliation.completedWithIncome} con ingreso</p></article><article className="stat-card"><div className="stat-header"><span>SIN INGRESO</span><Icon.Wallet/></div><h2>{reconciliation.completedWithoutIncome}</h2><p>Debe revisarse</p></article><article className="stat-card"><div className="stat-header"><span>INGRESOS VINCULADOS</span><Icon.Wallet/></div><h2>{reconciliation.linkedIncome}</h2><p>{reconciliation.orphanIncome} huérfanos</p></article><article className="stat-card gold-card"><div className="stat-header"><span>HISTÓRICOS SIN CITA</span><Icon.Grid/></div><h2>{reconciliation.unlinkedIncome}</h2><p>No se asignan automáticamente</p></article></div>{reconciliation.linkedDetails.length>0&&<div className="appointments">{reconciliation.linkedDetails.map(r=><div className="appointment" key={r.id}><div className="client-avatar">✓</div><div className="client-details"><strong>{r.name}</strong><span>{r.service} · {r.barber} · {r.date} {r.time}</span><small>Servicio {formatCurrency(r.price)} · Cobrado {formatCurrency(r.incomeAmount)} · {r.paymentMethod}</small></div><div className={`status ${r.difference===0?"status-confirmada":"status-cancelada"}`}>{r.status}</div><div className="appointment-time">{formatCurrency(r.incomeAmount)}</div></div>)}</div>}{reconciliation.completedWithoutIncome===0&&reconciliation.orphanIncome===0&&<p className="welcome-text" style={{marginTop:16}}>✓ No hay citas finalizadas pendientes de ingreso ni ingresos vinculados a citas inexistentes.</p>}</section><div className="panel" style={{marginTop:24}}><div className="panel-header"><div><p className="section-label">MOVIMIENTOS</p><h2>Historial financiero</h2></div></div><div className="search-bar"><Icon.Search/><input placeholder="Buscar concepto, categoría o método..." value={transactionSearch} onChange={e=>setTransactionSearch(e.target.value)}/></div><div className="service-actions" style={{margin:"12px 0 18px"}}><button onClick={()=>setTransactionFilter("Todos")} className={transactionFilter==="Todos"?"primary-button":""}>Todos</button><button onClick={()=>setTransactionFilter("Ingreso")}>Ingresos</button><button onClick={()=>setTransactionFilter("Gasto")}>Gastos</button></div><div className="appointments">{filteredTransactions.length===0?<div className="empty-state"><Icon.Wallet/><h3>No hay movimientos</h3></div>:filteredTransactions.map(t=><div className="appointment" key={t.id}><div className="client-avatar">{t.type==="Ingreso"?"+":"−"}</div><div className="client-details"><strong>{t.concept}</strong><span>{t.category} · {t.paymentMethod} · {t.time}</span><small>{formatTransactionDate(t.date)}{t.appointmentId?" · Cita vinculada":" · Movimiento histórico"}</small></div><div className={`status ${t.type==="Ingreso"?"status-confirmada":"status-cancelada"}`}>{t.type}</div><div className="appointment-time">{t.type==="Ingreso"?"+":"-"}{formatCurrency(t.amount)}</div></div>)}</div></div></section>'''
          s=s[:i]+replacement+s[j:]
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(finance): add reconciliation center"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/phase-2e-14-reconciliation.yml
          git add .github/workflows/phase-2e-14-reconciliation.yml
          git commit -m "chore(ci): remove phase 2e 14 temporary workflow"
          git push
