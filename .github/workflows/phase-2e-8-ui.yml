name: phase-2e-8-ui
on:
  push:
    paths:
      - '.github/workflows/phase-2e-8-ui.yml'
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch payment completion flow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()

          old_state = 'showTransactionModal,setShowTransactionModal]=useState(false),[editingService,setEditingService]'
          new_state = 'showTransactionModal,setShowTransactionModal]=useState(false),[showPaymentModal,setShowPaymentModal]=useState(false),[paymentAppointment,setPaymentAppointment]=useState<Appointment|null>(null),[paymentMethod,setPaymentMethod]=useState<PaymentMethod>("Efectivo"),[editingService,setEditingService]'
          if old_state not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(old_state, new_state, 1)

          old_fn = 'const updateStatus=async(id:string,status:AppointmentStatus)=>{const {error}=await supabase.from("appointments").update({status:uiToDbStatus(status)}).eq("id",id);if(error){alert("No fue posible actualizar el estado: "+error.message);return;}setAppointments(c=>c.map(a=>a.id===id?{...a,status}:a));};'
          new_fn = 'const handleCompleteAppointmentWithPayment=async()=>{if(!paymentAppointment)return;setSaving(true);try{const {error}=await supabase.rpc("complete_appointment_with_payment",{p_appointment_id:paymentAppointment.id,p_payment_method:paymentMethod});if(error)throw error;setShowPaymentModal(false);setPaymentAppointment(null);await loadData();}catch(err:any){alert("No fue posible registrar el pago y finalizar la cita: "+(err?.message||"Error desconocido"));}finally{setSaving(false);}};\n const updateStatus=async(id:string,status:AppointmentStatus)=>{if(status==="Finalizada"){const appointment=appointments.find(a=>a.id===id);if(!appointment)return;setPaymentAppointment(appointment);setPaymentMethod("Efectivo");setShowPaymentModal(true);return;}const {error}=await supabase.from("appointments").update({status:uiToDbStatus(status)}).eq("id",id);if(error){alert("No fue posible actualizar el estado: "+error.message);return;}setAppointments(c=>c.map(a=>a.id===id?{...a,status}:a));};'
          if old_fn not in text:
              raise SystemExit('updateStatus anchor not found')
          text = text.replace(old_fn, new_fn, 1)

          old_modal = '{isAdmin&&showTransactionModal&&<div className="modal-overlay">'
          payment_modal = '{showPaymentModal&&paymentAppointment&&<div className="modal-overlay"><div className="reservation-modal small-modal"><div className="modal-header"><div><p className="section-label">FINALIZAR CITA</p><h2>Registrar pago</h2></div><button className="close-button" onClick={()=>{setShowPaymentModal(false);setPaymentAppointment(null)}}><Icon.Close/></button></div><div className="form-grid"><div className="full-width"><span className="section-label">CLIENTE</span><strong>{paymentAppointment.name}</strong></div><div><span className="section-label">SERVICIO</span><strong>{paymentAppointment.service}</strong></div><div><span className="section-label">CITA</span><strong>{paymentAppointment.time}</strong></div><label className="full-width">Método de pago<select value={paymentMethod} onChange={e=>setPaymentMethod(e.target.value as PaymentMethod)}><option>Efectivo</option><option>Nequi</option><option>Transferencia</option><option>Tarjeta</option></select></label></div><p className="welcome-text" style={{marginTop:16}}>El sistema registrará el ingreso usando el precio vigente del servicio y finalizará la cita en una sola operación.</p><div className="modal-actions"><button type="button" className="cancel-button" onClick={()=>{setShowPaymentModal(false);setPaymentAppointment(null)}}>Cancelar</button><button type="button" className="primary-button" disabled={saving} onClick={handleCompleteAppointmentWithPayment}>{saving?"Registrando...":"Confirmar pago y finalizar"}</button></div></div></div>}\n {isAdmin&&showTransactionModal&&<div className="modal-overlay">'
          if old_modal not in text:
              raise SystemExit('transaction modal anchor not found')
          text = text.replace(old_modal, payment_modal, 1)

          path.write_text(text)
          PY
      - name: Commit patched page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'feat(finance): connect appointment completion to payment' || exit 0
          git push origin main
