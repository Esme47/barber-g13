name: phase-2e-15-financial-close
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch current finance screen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('app/page.tsx')
          s=p.read_text()
          start=s.find(' const renderFinances=()=>{')
          end=s.find(';\n if(authLoading)return', start)
          if start < 0 or end < 0:
              raise SystemExit('finance function markers not found')
          fn=''' const renderFinances=()=>{\n  const closeDate=dateKey(new Date());\n  const closeTransactions=transactions.filter(t=>t.date===closeDate);\n  const closeIncome=closeTransactions.filter(t=>t.type==="Ingreso").reduce((a,t)=>a+t.amount,0);\n  const closeExpenses=closeTransactions.filter(t=>t.type==="Gasto").reduce((a,t)=>a+t.amount,0);\n  const closeProfit=closeIncome-closeExpenses;\n  const closeLinked=closeTransactions.filter(t=>t.type==="Ingreso"&&t.appointmentId).length;\n  const closeHistorical=closeTransactions.filter(t=>t.type==="Ingreso"&&!t.appointmentId).length;\n  const closeAppointments=historicalAppointments.filter(a=>a.date===closeDate);\n  const closeAppointmentsWithoutIncome=closeAppointments.filter(a=>!closeTransactions.some(t=>t.type==="Ingreso"&&t.appointmentId===a.id)).length;\n  const closeMethods=paymentSummary.map(item=>({method:item.method,amount:closeTransactions.filter(t=>t.type==="Ingreso"&&t.paymentMethod===item.method).reduce((a,t)=>a+t.amount,0)}));\n  const closeReady=closeAppointmentsWithoutIncome===0;\n  return <div className="space-y-6">\n   <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">\n    <div><h2 className="text-2xl font-bold">Finanzas</h2><p className="text-sm text-slate-500">Control, conciliación y cierre financiero</p></div>\n    <button onClick={()=>setShowTransactionModal(true)} className="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">＋ Nuevo movimiento</button>\n   </div>\n   <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">\n    <div className="rounded-2xl border bg-white p-4"><p className="text-xs text-slate-500">Ingresos históricos</p><p className="mt-1 text-xl font-bold">{formatCurrency(financialSummary.sales)}</p></div>\n    <div className="rounded-2xl border bg-white p-4"><p className="text-xs text-slate-500">Gastos históricos</p><p className="mt-1 text-xl font-bold">{formatCurrency(financialSummary.expenses)}</p></div>\n    <div className="rounded-2xl border bg-white p-4"><p className="text-xs text-slate-500">Utilidad histórica</p><p className="mt-1 text-xl font-bold">{formatCurrency(financialSummary.profit)}</p></div>\n    <div className="rounded-2xl border bg-white p-4"><p className="text-xs text-slate-500">Margen</p><p className="mt-1 text-xl font-bold">{financialInsights.margin.toFixed(1)}%</p></div>\n   </div>\n   <div className="rounded-2xl border bg-white p-5">\n    <div className="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">\n     <div><h3 className="font-bold">Cierre financiero del día</h3><p className="text-sm text-slate-500">{formatTransactionDate(closeDate)} · solo lectura, sin crear ni modificar movimientos automáticamente</p></div>\n     <span className={`rounded-full px-3 py-1 text-xs font-bold ${closeReady?"bg-emerald-100 text-emerald-700":"bg-amber-100 text-amber-700"}`}>{closeReady?"✓ LISTO PARA CIERRE":"⚠ REQUIERE REVISIÓN"}</span>\n    </div>\n    <div className="mt-4 grid grid-cols-2 gap-3 md:grid-cols-4">\n     <div className="rounded-xl bg-slate-50 p-3"><p className="text-xs text-slate-500">Ingresos del día</p><p className="font-bold">{formatCurrency(closeIncome)}</p></div>\n     <div className="rounded-xl bg-slate-50 p-3"><p className="text-xs text-slate-500">Gastos del día</p><p className="font-bold">{formatCurrency(closeExpenses)}</p></div>\n     <div className="rounded-xl bg-slate-50 p-3"><p className="text-xs text-slate-500">Utilidad del día</p><p className="font-bold">{formatCurrency(closeProfit)}</p></div>\n     <div className="rounded-xl bg-slate-50 p-3"><p className="text-xs text-slate-500">Movimientos</p><p className="font-bold">{closeTransactions.length}</p></div>\n    </div>\n    <div className="mt-4 grid gap-4 md:grid-cols-2">\n     <div><h4 className="mb-2 text-sm font-semibold">Agenda ↔ Finanzas</h4><div className="space-y-2 text-sm"><div className="flex justify-between"><span>Citas finalizadas</span><b>{closeAppointments.length}</b></div><div className="flex justify-between"><span>Ingresos vinculados</span><b>{closeLinked}</b></div><div className="flex justify-between"><span>Históricos sin cita</span><b>{closeHistorical}</b></div><div className="flex justify-between"><span>Citas sin ingreso</span><b className={closeAppointmentsWithoutIncome?"text-amber-600":"text-emerald-600"}>{closeAppointmentsWithoutIncome}</b></div></div></div>\n     <div><h4 className="mb-2 text-sm font-semibold">Ingresos por medio de pago</h4><div className="grid grid-cols-2 gap-2">{closeMethods.map(item=><div key={item.method} className="rounded-xl border p-3"><p className="text-xs text-slate-500">{item.method}</p><p className="font-bold">{formatCurrency(item.amount)}</p></div>)}</div></div>\n    </div>\n   </div>\n   {regularizableAppointments.length>0&&<div className="rounded-2xl border border-amber-200 bg-amber-50 p-5"><div className="flex items-start justify-between gap-3"><div><h3 className="font-bold text-amber-900">Regularizaciones pendientes</h3><p className="text-sm text-amber-800">Estas citas finalizadas todavía no tienen un ingreso vinculado. No se registra nada hasta que un administrador lo confirme.</p></div><span className="rounded-full bg-white px-3 py-1 text-xs font-bold text-amber-700">{regularizableAppointments.length}</span></div><div className="mt-3 space-y-2">{regularizableAppointments.map(a=><div key={a.id} className="flex flex-col gap-2 rounded-xl bg-white p-3 sm:flex-row sm:items-center sm:justify-between"><div><p className="font-semibold">{a.name} · {a.service}</p><p className="text-xs text-slate-500">{formatTransactionDate(a.date)} · {a.time} · {a.barber} · {formatCurrency(a.price)}</p></div><button onClick={()=>{setRegularizationAppointment(a);setRegularizationAmount(String(a.price));setRegularizationPaymentMethod("Efectivo");setShowRegularizationModal(true);}} className="rounded-lg bg-amber-600 px-3 py-2 text-xs font-bold text-white">Regularizar</button></div>)}</div></div>}\n   <div className="grid gap-4 md:grid-cols-3">{financialPeriods.today&&<div className="rounded-2xl border bg-white p-4"><p className="text-xs text-slate-500">Hoy</p><p className="mt-1 font-bold">{formatCurrency(financialPeriods.today.income)}</p><p className="text-xs text-slate-500">Utilidad {formatCurrency(financialPeriods.today.profit)}</p></div>}{financialPeriods.week&&<div className="rounded-2xl border bg-white p-4"><p className="text-xs text-slate-500">Esta semana</p><p className="mt-1 font-bold">{formatCurrency(financialPeriods.week.income)}</p><p className="text-xs text-slate-500">Utilidad {formatCurrency(financialPeriods.week.profit)}</p></div>}{financialPeriods.month&&<div className="rounded-2xl border bg-white p-4"><p className="text-xs text-slate-500">Este mes</p><p className="mt-1 font-bold">{formatCurrency(financialPeriods.month.income)}</p><p className="text-xs text-slate-500">Utilidad {formatCurrency(financialPeriods.month.profit)}</p></div>}</div>\n   <div className="rounded-2xl border bg-white p-5"><div className="mb-4 flex flex-col gap-3 sm:flex-row"><input value={transactionSearch} onChange={e=>setTransactionSearch(e.target.value)} placeholder="Buscar movimiento..." className="w-full rounded-xl border px-3 py-2 text-sm"/><select value={transactionFilter} onChange={e=>setTransactionFilter(e.target.value as "Todos"|TransactionType)} className="rounded-xl border px-3 py-2 text-sm"><option>Todos</option><option>Ingreso</option><option>Gasto</option></select></div><div className="space-y-2">{filteredTransactions.map(t=><div key={t.id} className="flex flex-col gap-1 rounded-xl border p-3 sm:flex-row sm:items-center sm:justify-between"><div><p className="font-semibold">{t.concept}</p><p className="text-xs text-slate-500">{t.category} · {t.paymentMethod} · {formatTransactionDate(t.date)} {t.time}{t.appointmentId?" · Cita vinculada":" · Movimiento histórico"}</p></div><p className={`font-bold ${t.type==="Ingreso"?"text-emerald-600":"text-rose-600"}`}>{t.type==="Ingreso"?"+":"-"}{formatCurrency(t.amount)}</p></div>)}{filteredTransactions.length===0&&<p className="py-6 text-center text-sm text-slate-500">No hay movimientos para mostrar.</p>}</div></div>\n  </div>\n }'''
          s=s[:start]+fn+s[end:]
          p.write_text(s)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','app/page.tsx'],check=True)
          subprocess.run(['git','commit','-m','feat(finance): add daily financial close center'],check=True)
          subprocess.run(['git','push'],check=True)
          PY